# App icons for every platform, from tools/make_icon.py.
# Regenerate: python3 -I tools/make_icon.py <Animal Pack Remastered dir> && dart pub global run flutter_launcher_icons (dart pub global activate flutter_launcher_icons first)
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_foreground_inset: 0 # foreground.png is already laid out for the crop
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFF6E9"
    theme_color: "#FF9F7A"
